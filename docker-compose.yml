version: '3.8'

services:
  # NoSQL Database for Data Persistence and MLOps logging (Optional Local Fallback)
  mongodb:
    image: mongo:latest
    container_name: mongodb_restaurant
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - restaurant-network
    restart: always

  # Machine Learning Microservice (Python/FastAPI)
  # Handles sentiment prediction using trained neural network model
  # Port: 8000 - Internal ML prediction endpoint
  ml-service:
    build:
      context: ./ml-service-python
      dockerfile: Dockerfile
    container_name: ml_service_python
    ports:
      - "8000:8000"
    networks:
      - restaurant-network
    restart: always

  # High-Performance API Gateway (Go 1.23)
  # Routes client requests to ML service and handles request validation
  # Port: 8080 - External API endpoint for clients
  gateway-service:
    build:
      context: ./gateway-service-go
      dockerfile: Dockerfile
    container_name: gateway_service_go
    ports:
      - "8080:8080"
    environment:
      # Point to ML service using Docker network DNS
      # "http://ml-service:8000" resolves within Docker network
      - ML_SERVICE_URL=http://ml-service:8000/v1/predict
      # Enable Gin release mode for optimal performance
      - GIN_MODE=release
    depends_on:
      # Ensure ML service starts before gateway
      - ml-service
    env_file:
      # Injects cloud MONGO_URI string into Go runtime from remote .env file
      - .env
    networks:
      - restaurant-network
    restart: always

  # Frontend User Interface (React / Vite)
  # Captures consumer reviews graphical input
  # Port: 5173 - External web user access point
  frontend:
    build:
      context: ./restaurant-review-front
      dockerfile: Dockerfile
    container_name: restaurant-review-front
    ports:
      - "5173:5173"
    volumes:
      - ./restaurant-review-front:/app
      - /app/node_modules
    networks:
      - restaurant-network
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:8080
    restart: always

volumes:
  mongo-data:

networks:
  restaurant-network:
    driver: bridge